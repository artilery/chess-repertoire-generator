name: Repertoire generator · GitHub Pages
# This workflow is copied into the standalone repository with the built site.
# The repository check prevents deployment from the private desktop project.
on:
  push:
    branches: ["**"]
    paths:
      - 'site/**'
      - 'scripts/check-repertoire-web.mjs'
      - '.github/workflows/repertoire-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repertoire-generator-pages
  cancel-in-progress: true
jobs:
  pages:
    # Both the exact repository and explicit approval switch are required.
    if: github.repository == 'artilery/chess-repertoire-generator' && vars.REPERTOIRE_PAGES_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate the standalone site and its repository base
        run: node scripts/check-repertoire-web.mjs site
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload only the standalone site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
